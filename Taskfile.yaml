version: '3'
env:
  TaskInfo: "Create"

tasks:
  build:
    cmds:
      - kind create cluster --name=simple-cluster --config simple-cluster.yaml
  destroy:
    cmds:
      - kind delete cluster --name simple-cluster
  lab:
    cmds:
      - echo "poc lab commands"
      - helm repo add strimzi https://strimzi.io/charts/
      - helm install strimzi/strimzi-kafka-operator --generate-name
      - kubectl apply -f ./manifests/kafka-ephemeral.yaml
      - kubectl apply -f ./manifests/kafka-topic.yaml
      - echo "try using the producer and the consumer scripts in the ./hack folder"
#      - kubectl apply -f kafkaConnect.yaml
#      - kubectl apply -f kafkaConnector.yaml
  test:
    cmds:
      - echo "tests commmands"

